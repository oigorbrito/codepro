name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed in validated run
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed in validated run
        with:
          python-version: "3.14.7"
      - name: Record environment fingerprint
        run: |
          python -VV
          python -c "import platform; print(platform.platform()); print(platform.machine())"
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          printf 'image_os=%s\n' "${ImageOS:-unknown}"
          printf 'image_version=%s\n' "${ImageVersion:-unknown}"
          printf 'locale=%s\n' "${LANG:-unknown}"
          date +'%Z %z'
          git rev-parse HEAD
      - name: Check foundation contract
        run: python tools/check_foundation.py
      - name: Run baseline fixture
        run: python -m arkx.baseline
        env:
          PYTHONPATH: src
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: Run mutation sensitivity probe
        run: python tools/mutation_probe.py
        env:
          PYTHONPATH: src
      - name: Record chassis semantic fingerprint
        run: python tools/chassis_fingerprint.py
        env:
          PYTHONPATH: src
      - name: Run empirical CLI baseline probe
        run: python tools/cli_empirical_probe.py
      - name: Compile Python sources
        run: python -m compileall -q src tests tools

  compatibility:
    needs: foundation
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed in validated run
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed in validated run
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record compatibility interpreter
        run: python -VV
      - name: Run compatibility test suite
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: Verify semantic fingerprint
        run: python tools/chassis_fingerprint.py
        env:
          PYTHONPATH: src
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
