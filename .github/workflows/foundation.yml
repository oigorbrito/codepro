name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check foundation contract
        run: python tools/check_foundation.py
      - name: Run baseline fixture
        run: python -m arkx.baseline
        env:
          PYTHONPATH: src
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: Compile Python sources
        run: python -m compileall -q src tests tools

  packaged-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv .venv-release-check
          . .venv-release-check/bin/activate
          python -m pip install --no-index --find-links dist codepro
      - name: Verify packaged public boundary
        run: |
          . .venv-release-check/bin/activate
          test "$(codepro --version)" = "codepro 0.3.0.dev0"
          codepro doctor --json
          codepro baseline
          python -m unittest discover -s tests -t .
