name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check foundation contract
        run: python tools/check_foundation.py
      - name: Run baseline fixture
        run: python -m arkx.baseline
        env:
          PYTHONPATH: src
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - name: Compile Python sources
        run: python -m compileall -q src tests tools
