name: Actions runner diagnostic

on:
  push:
    branches:
      - "reconcile/04a-capability-recovery"
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  schedule-probe:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Prove runner scheduling
        run: |
          echo "RUNNER_SCHEDULED=YES"
          uname -a
