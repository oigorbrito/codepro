name: Mini v2.4.6 runtime access

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mini-v246-runtime-access.yml"
      - "tools/run_mini_v246_runtime_access.py"
      - "tests/test_mini_v246_runtime_access.py"

permissions:
  contents: read

jobs:
  runtime-access:
    name: 5.1-A runtime access
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # checkout v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: "3.13"

      - name: Verify runtime-access runner contract
        run: python -m unittest -v tests.test_mini_v246_runtime_access

      - name: Run Block 5.1-A
        run: |
          python tools/run_mini_v246_runtime_access.py \
            --probe-image python:3.11-slim \
            --output logs/architecture/mini-v246-runtime-access/result.json

      - name: Upload runtime access evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upload-artifact v4
        with:
          name: mini-v246-runtime-access-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: logs/architecture/mini-v246-runtime-access/
