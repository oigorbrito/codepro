name: Chassis shootout runner contract

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/chassis-shootout-contract.yml"
      - "tools/run_chassis_ci_contract.py"
      - "tests/test_chassis_ci_contract.py"

permissions:
  contents: read

concurrency:
  group: chassis-shootout-contract-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run runner contract tests
        run: python -m unittest -v tests.test_chassis_ci_contract

  deterministic-adapter-smoke:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        candidate: [nano, agentless]
    env:
      EVIDENCE_DIR: logs/chassis-shootout/contract/${{ matrix.candidate }}
      WORKDIR: .tmp/chassis-shootout/${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Record runner identity
        run: |
          mkdir -p "$EVIDENCE_DIR"
          git rev-parse HEAD | tee "$EVIDENCE_DIR/project-commit.txt"
          python -VV | tee "$EVIDENCE_DIR/python.txt"
          uname -a | tee "$EVIDENCE_DIR/uname.txt"

      - name: Run deterministic candidate fixture
        run: |
          python tools/run_chassis_ci_contract.py \
            --candidate "${{ matrix.candidate }}" \
            --candidate-revision "fixture-v1" \
            --candidate-command-json '["python","-c","from pathlib import Path; Path(\"result.txt\").write_text(\"fixed\\n\")"]' \
            --verifier-command-json '["python","-c","from pathlib import Path; raise SystemExit(0 if Path(\"result.txt\").read_text() == \"fixed\\n\" else 1)"]' \
            --workdir "$WORKDIR" \
            --output "$EVIDENCE_DIR/result.json"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chassis-contract-${{ matrix.candidate }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: logs/chassis-shootout/contract/${{ matrix.candidate }}/

  negative-control:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: logs/chassis-shootout/contract/broken
      WORKDIR: .tmp/chassis-shootout/broken
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run intentionally broken candidate
        id: broken
        continue-on-error: true
        run: |
          python tools/run_chassis_ci_contract.py \
            --candidate broken-control \
            --candidate-revision fixture-broken-v1 \
            --candidate-command-json '["python","-c","print(\"no repair\")"]' \
            --verifier-command-json '["python","-c","from pathlib import Path; raise SystemExit(0 if Path(\"result.txt\").exists() else 1)"]' \
            --workdir "$WORKDIR" \
            --output "$EVIDENCE_DIR/result.json"

      - name: Assert negative control failed closed
        if: always()
        env:
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          test "$BROKEN_OUTCOME" = "failure"
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("logs/chassis-shootout/contract/broken/result.json").read_text())
          assert r["classification"] == "VERIFIED_FAIL", r
          assert r["verifier_result"] == "FAIL", r
          print(json.dumps({"negative_control": "PASS", "classification": r["classification"]}))
          PY

      - name: Upload negative-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chassis-contract-broken-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: logs/chassis-shootout/contract/broken/
