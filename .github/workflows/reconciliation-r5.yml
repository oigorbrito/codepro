name: Reconciliation R5

on:
  push:
    branches:
      - "reconcile/04a-capability-recovery"
    paths:
      - ".github/workflows/reconciliation-r5.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "experiments/**"
      - "package.json"
      - "tsconfig.json"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Record exact candidate
        run: |
          python -VV
          git rev-parse HEAD
          test -z "$(git status --porcelain=v1)"
      - name: Install CodePro without dependency resolution
        run: python -m pip install --disable-pip-version-check --no-input --no-deps -e .
      - name: Probe CLI
        run: |
          codepro --version
          codepro doctor --json
          codepro inspect --json
          python -m arkx --help
      - name: Check foundation and baseline
        env:
          PYTHONPATH: src
        run: |
          python tools/check_foundation.py
          python -m arkx.baseline
      - name: Run full Python suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: Run mutation sensitivity probe
        env:
          PYTHONPATH: src
        run: python tools/mutation_probe.py
      - name: Verify chassis fingerprint
        env:
          PYTHONPATH: src
        run: python tools/chassis_fingerprint.py
      - name: Compile Python
        run: python -m compileall -q src tests tools

  typescript-and-real-vertical:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind explicit local Python and evidence directory
        shell: bash
        run: |
          echo "CODEPRO_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "CODEPRO_EVIDENCE_DIR=$RUNNER_TEMP/codepro-r5-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/codepro-r5-evidence"
      - name: Install Node dependencies without lockfile mutation
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Validate local-inference telemetry contract
        run: ./node_modules/.bin/tsx tools/check-telemetry.ts
      - name: Build frontend
        run: npm run build
      - name: Validate authoritative adapter static boundary
        shell: bash
        run: |
          ! grep -q "simulatedChangedFiles" src/chassis/vertical.ts
          ! grep -q 'status: "PASS"' src/chassis/vertical.ts
          grep -q "CODEPRO_PYTHON" src/chassis/vertical.ts
          grep -q "CODEPRO_EVIDENCE_DIR" src/chassis/vertical.ts
          grep -q "spawnSync" src/chassis/vertical.ts
          grep -q "shell: false" src/chassis/vertical.ts
      - name: Run real TS to Python vertical controls
        run: ./node_modules/.bin/tsx tools/check-r5-composed-vertical.ts
      - name: Verify tracked candidate remained clean
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=no)"

  provider-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prove R5 workflow has no provider credentials or provider runners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/reconciliation-r5.yml").read_text(
              encoding="utf-8"
          )
          forbidden = (
              "GEMINI" + "_API_KEY",
              "ANTHROPIC" + "_API_KEY",
              "run_mini_v246_" + "gemini_api_qualification.py",
              "run_mini_v246_" + "executor_qualification.py",
              "run_gemini_cli_" + "executor_qualification.py",
          )
          found = [item for item in forbidden if item in workflow]
          if found:
              raise SystemExit(f"forbidden provider coupling in R5 workflow: {found}")
          print("PROVIDER_CALL=NOT_EXECUTED")
          print("EXECUTOR_PROMOTION=NOT_AUTHORIZED")
          PY
