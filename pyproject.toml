[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepro"
dynamic = ["version"]
description = "Executor-agnostic software-engineering chassis with a tested CLI and evidence contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codepro = "codepro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "codepro._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
