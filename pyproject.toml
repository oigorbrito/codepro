[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepro"
version = "0.3.0.dev0"
description = "Executor-agnostic software-engineering chassis with empirical evidence contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codepro = "arkx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
