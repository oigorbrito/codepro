[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codepro"
dynamic = ["version"]
description = "Executor-agnostic software-engineering chassis with an empirically tested CLI boundary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
codepro = "arkx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "arkx.__version__"}
